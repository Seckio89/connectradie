    <!-- No maximum-scale / user-scalable=no. Blocking pinch-zoom is a WCAG 2.1
         SC 1.4.4 (Resize Text) failure, and it was the reason there was no way
         to enlarge text at all: Android WebView honours those directives, which
         is how this ships. Settings → Interface now offers a text-size slider,
         and pinch-zoom is the escape hatch beyond its range. Double-tap zoom
         stays suppressed via touch-action in mobile-responsive.css. -->
