name: CI

on:
  push:
    branches: [master]
  # No `branches:` filter — CI runs on EVERY pull request, whatever it targets.
  #
  # It used to be `branches: [master]`, which silently skipped stacked PRs. #169
  # changed stripe-webhook, the reconciler and a new _shared helper on the money
  # path, and because it targeted another feature branch the only checks that
  # ran were Vercel's. No typecheck, no tests, no Deno ratchet, no DB Columns —
  # on 1,291 lines of payment code. It read as "checks passed".
  #
  # Edge functions aren't covered by `npm run typecheck` at all, so DB Columns
  # is their only column-level safety net. Skipping it on stacked work is
  # exactly where it is least affordable.
  pull_request:

jobs:
  type-check:
    name: Type Check (ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # NOT `npx tsc --noEmit`: the root tsconfig.json is solution-style
      # ("files": [] + project references), so that command checks NOTHING and
      # always exits 0. It passed for as long as this workflow has existed while
      # real type errors — including undefined identifiers that crash at
      # runtime — accumulated unnoticed.
      #
      # The ratchet targets tsconfig.app.json and fails only on NEW errors, so
      # the pre-existing backlog doesn't block every commit while still
      # preventing regressions. Baseline: .typecheck-baseline.json
      - run: npm run typecheck:ratchet

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # --no-file-parallelism: the suite is flaky under parallel workers
      # (files intermittently report "No test suite found"). Serial is reliable.
      - run: npx vitest run --no-file-parallelism

  edge-functions:
    name: Edge Functions (Deno ratchet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Edge functions are Deno and are NOT covered by the TypeScript job above.
      # They had never been type-checked anywhere, so this ratchets against an
      # allowlist of known-failing functions rather than blocking every commit.
      #
      # That allowlist is currently EMPTY (9d3dab5 cleared it, along with the 4
      # bugs the casts were hiding), so in practice this is now a hard check:
      # any edge function that stops type-checking fails CI.
      #
      # Counts deliberately live in .edge-typecheck-baseline.json, not in this
      # comment — the previous version claimed "8 of 65" long after both numbers
      # had moved.
      - run: node scripts/typecheck-edge.mjs

  db-columns:
    name: DB Columns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # TypeScript structurally CANNOT catch an unknown column: postgrest-js
      # binds the payload to a naked generic, inference erases object-literal
      # freshness, and freshness is what drives excess-property checking. Edge
      # functions aren't type-checked at all and create untyped clients, so
      # nothing there is checked either — and those are the money paths.
      #
      # This scanner is the only column-level safety net. Five bugs of this
      # class have already shipped silently (see the header of the script):
      # bonus payments, the price-reduction flow, ABN-less tax invoices,
      # admin moderation, and cancelled services rendering as active.
      #
      # Schema source is the generated src/types/supabase.ts — in-repo, no
      # credentials. Regenerate it whenever migrations land.
      - run: npm run check:columns

  ink-contrast:
    name: Ink Contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No `npm ci` — the script uses only Node builtins.
      #
      # --ink is the page background, and reads as a text colour only on a
      # bright fill. The v2 dark cutover mapped `bg-X-600 text-white
      # hover:bg-X-700` onto `bg-ct-surface-2 text-ct-ink
      # hover:bg-ct-surface-2` wholesale, moving both halves — so 153 controls
      # and headings shipped invisible at rest, the /hire hero H1 and the
      # footer wordmark among them, on public signed-out pages.
      #
      # The Playwright contrast sweep reported 0 failures on that same tree: it
      # measures routes at rest, never opened a modal, never rendered a sent
      # message, never hovered, and its 14 routes were all authenticated. This
      # reads every ternary branch in source instead, so a modal body is no
      # harder to see than a landing page.
      - run: npm run check:ink

  navigability:
    name: Navigability
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No `npm ci` — the script uses only Node builtins.
      #
      # A route can be perfectly implemented, type-checked and RLS-correct and
      # still be unfindable, and nothing else in this pipeline notices. This
      # catches links that resolve to nothing, routes no menu points at,
      # breadcrumbs labelled for routes that were deleted, pages whose browser
      # tab has no name, and redirects that silently eat a query string — which
      # is how six Stripe return URLs ended up losing their payment result.
      #
      # Baselined like the typecheck ratchet: the findings already triaged into
      # audit-findings/2026-07-27-navigability.md do not block the build, a NEW
      # one does. Run `npm run check:nav -- --verbose` locally for the full
      # route map, and only ever re-baseline deliberately.
      - run: npm run check:nav:ci

  docs-edge-list:
    name: Docs (edge function list)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No `npm ci` — the script uses only Node builtins.
      #
      # CLAUDE.md claimed 20 edge functions and named 19 while the repo had 65,
      # and the stale count had already been copied into task-router.md. Adding
      # a function is exactly when nobody thinks about the docs, so the list is
      # generated from disk and this fails when it drifts.
      - run: node scripts/check-edge-fn-docs.mjs

  edge-tests:
    name: Edge Function Tests (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Six Deno test files existed for a year and CI ran NONE of them — they
      # only executed if someone typed the command by hand, which is the same
      # failure mode as the rate limiter that spent its whole life returning
      # allowed:true. A test nothing runs is documentation.
      #
      # `npx deno@2` rather than an install step, matching scripts/typecheck-edge.mjs.
      #
      # --allow-env: guards.test.ts sets fake config before importing handlers.
      # --allow-net: the npm: and jsr: specifiers resolve over the network.
      - run: npx --yes deno@2 test --allow-env --allow-net --allow-read --node-modules-dir=auto supabase/functions/

  build:
    name: Build
    needs: [type-check, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

  contrast:
    name: Contrast (browser)
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The one check here that needs a real browser, and the only one that can
      # see a fill declared on a PARENT and text on a CHILD. check:ink reads
      # class strings, so those two live in different strings and nothing static
      # connects them — seven defects hid in that gap, including the /hire hero
      # headline at 1:1 on a public page.
      #
      # Placeholder Supabase vars because the client throws at module load
      # without them and React never mounts. Every request is answered from
      # fixtures, so these reach nothing: no credentials, no network, which is
      # why this can run in CI at all where audit:nav cannot.
      - run: npx playwright install --with-deps chromium
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://uoqygmizupdpanplpvor.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-contrast-sweep-placeholder
      # Server and sweep in ONE step: a process backgrounded in its own step is
      # not reliably still alive in the next one.
      #
      # --baseline: contrast failures ALWAYS fail. What is baselined is the set
      # of routes this harness cannot currently measure — six of them redirect,
      # crash or render near-empty under the fixtures. Without that, this job
      # would sit permanently red on a codebase with zero contrast failures,
      # which is how a check teaches people to ignore it. A route that NEWLY
      # stops rendering still fails, because scoring an unmeasured route as a
      # pass is the exact blind spot this sweep was built to close.
      - name: Sweep
        run: |
          npx vite preview --port 4173 &
          PREVIEW=$!
          trap 'kill $PREVIEW 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:4173/ || { echo "preview never came up"; exit 1; }
          npm run check:contrast:ci
